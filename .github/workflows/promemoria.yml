# Promemoria automatici via email (vedi scripts/promemoria.mjs).
# GitHub ragiona in ora UTC e non conosce l'ora legale: ogni promemoria è programmato
# in tre orari. Lo script invia solo nella finestra giusta (3 ore) e ogni email una volta
# sola: così, con o senza ora legale, se Gmail è occupato c'è sempre un secondo tentativo.
# Ogni giorno alle 10 lo script controlla se tocca un promemoria: il sabato il
# settimanale, e il mensile 3 giorni prima, il giorno prima e il giorno dopo la scadenza.
# Il lunedì alle 9:30 l'ultimo settimanale: lo script lo manda solo fino alle 11:30,
# prima delle riunioni (Milano alle 12, Roma alle 13).
name: Promemoria

on:
  schedule:
    - cron: '30 7,8,9 * * 1'     # lunedì ore 9:30 italiane (ultimo settimanale, giorno della riunione)
    - cron: '0 8,9,10 * * *'     # ogni giorno ore 10:00 italiane (settimanale del sabato e mensile)
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Quale promemoria inviare'
        required: true
        default: sabato
        type: choice
        options: [sabato, lunedi, mensile_3giorni, mensile_vigilia, mensile_riepilogo]
      mese:
        description: 'Solo per i promemoria mensili: il mese, es. 2026-09 (vuoto = il mese appena concluso)'
        required: false
      email_prova:
        description: 'Prova: se compilato, TUTTE le email vanno solo a questo indirizzo'
        required: false

permissions:
  contents: read
  actions: write     # serve al passo "Mantieni attivo"

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Invia promemoria
        run: node scripts/promemoria.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SITO_URL: ${{ vars.SITO_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_UTENTE: ${{ secrets.GMAIL_UTENTE }}
          GMAIL_PASSWORD_APP: ${{ secrets.GMAIL_PASSWORD_APP }}
          TIPO: ${{ inputs.tipo }}
          MESE: ${{ inputs.mese }}
          EMAIL_PROVA: ${{ inputs.email_prova }}
      # GitHub sospende le azioni programmate dopo 60 giorni senza modifiche al
      # repository: questo passo le riattiva a ogni esecuzione.
      - name: Mantieni attivo
        if: always()
        run: gh workflow enable promemoria.yml
        env:
          GH_TOKEN: ${{ github.token }}
